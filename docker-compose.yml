name: rinha-2026-italo-deep

# Variant deep v5: Adaptive NPROBE=5 fast + NPROBE_DEEP=10 (mild deep pass).
# Probes top-5 + top-10 on borderlines — wider net than 5→8 (+5071 winner)
# without the p99 penalty of 5→16 (locally crushed p99 to 27ms). Targets the
# 1 FN that the 5→8 winner couldn't catch. Risk: extra 2 clusters scanned on
# ~5% of queries adds ~0.5-1ms to those — acceptable if it kills the FN.
# Image: italovinicius18/rinha-2026-api:v2-adaptive (NPROBE_DEEP env).
# Total budget: haproxy 0.15 + data-prep 0.05 + 2×api 0.40 = 1.00 CPU / 350 MB.

services:
  data-prep:
    image: italovinicius18/rinha-2026-data-prep:v1
    volumes:
      - index-data:/shared
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "25MB"

  api1:
    image: italovinicius18/rinha-2026-api:v2-adaptive
    environment:
      LISTEN_ADDR: ":8080"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "5"
      NPROBE_DEEP: "10"
      GOMAXPROCS: "1"
      GOGC: "200"
    volumes:
      - index-data:/data:ro
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "155MB"

  api2:
    image: italovinicius18/rinha-2026-api:v2-adaptive
    environment:
      LISTEN_ADDR: ":8080"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "5"
      NPROBE_DEEP: "10"
      GOMAXPROCS: "1"
      GOGC: "200"
    volumes:
      - index-data:/data:ro
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "155MB"

  haproxy:
    image: haproxy:2.9-alpine
    depends_on: [api1, api2]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "15MB"

networks:
  rinha:
    driver: bridge

volumes:
  index-data:
