name: rinha-2026-italo-deep

# Variant deep v6: Adaptive NPROBE=5 / DEEP=10 + HAProxy CPU 0.20 / api 0.375 each.
# Same canonical algorithm (best score so far: +5097-5102) but redistributes CPU
# slightly toward HAProxy. The CFS-throttle rule (CLAUDE.md P10) says LB
# starvation dominates p99 on tight budgets; canonical sits at HAProxy 0.15.
# Hypothesis: bumping LB to 0.20 may further reduce p99 jitter on Mac Mini.
# Total budget: haproxy 0.20 + data-prep 0.05 + 2×api 0.375 = 1.00 CPU / 350 MB.

services:
  data-prep:
    image: italovinicius18/rinha-2026-data-prep:v1
    volumes:
      - index-data:/shared
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "25MB"

  api1:
    image: italovinicius18/rinha-2026-api:v2-adaptive
    environment:
      LISTEN_ADDR: ":8080"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "5"
      NPROBE_DEEP: "10"
      GOMAXPROCS: "1"
      GOGC: "200"
    volumes:
      - index-data:/data:ro
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.375"
          memory: "155MB"

  api2:
    image: italovinicius18/rinha-2026-api:v2-adaptive
    environment:
      LISTEN_ADDR: ":8080"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "5"
      NPROBE_DEEP: "10"
      GOMAXPROCS: "1"
      GOGC: "200"
    volumes:
      - index-data:/data:ro
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.375"
          memory: "155MB"

  haproxy:
    image: haproxy:2.9-alpine
    depends_on: [api1, api2]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "15MB"

networks:
  rinha:
    driver: bridge

volumes:
  index-data:
